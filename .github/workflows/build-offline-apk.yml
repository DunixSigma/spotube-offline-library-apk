name: Build Spotube Offline Library APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get project files
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 and NDK 29
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Set up Flutter 3.35.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Create local build configuration
        run: |
          cat > lib/collections/env.g.dart <<'ENV'
          part of 'env.dart';

          final class _Env {
            static const String lastFmApiKey = '';
            static const String lastFmApiSecret = '';
            static const int _hideDonations = 1;
            static const String _enableUpdateChecker = '0';
            static const String _releaseChannel = 'stable';
          }
          ENV

      - name: Build ARM64 APK
        run: flutter build apk --release --flavor offline --target-platform android-arm64 --split-per-abi

      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Spotube-Offline-Library-ARM64-APK
          path: build/app/outputs/flutter-apk/*arm64-v8a*release.apk
          if-no-files-found: error
          retention-days: 7
